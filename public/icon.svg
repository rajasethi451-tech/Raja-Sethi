<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Cute Lion Head Outline / Icon Center -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Lion Mane -->
    <circle cx="0" cy="0" r="160" fill="#D97706" />
    <!-- Lion Face -->
    <circle cx="0" cy="0" r="120" fill="#FDE68A" />
    <!-- Ears -->
    <circle cx="-100" cy="-100" r="36" fill="#D97706" />
    <circle cx="-100" cy="-100" r="20" fill="#FEF3C7" />
    <circle cx="100" cy="-100" r="36" fill="#D97706" />
    <circle cx="100" cy="-100" r="20" fill="#FEF3C7" />
    <!-- Eyes -->
    <circle cx="-42" cy="-20" r="16" fill="#78350F" />
    <circle cx="-38" cy="-24" r="5" fill="#FFFFFF" />
    <circle cx="42" cy="-20" r="16" fill="#78350F" />
    <circle cx="46" cy="-24" r="5" fill="#FFFFFF" />
    <!-- Cheeks -->
    <circle cx="-64" cy="18" r="14" fill="#FCA5A5" opacity="0.8" />
    <circle cx="64" cy="18" r="14" fill="#FCA5A5" opacity="0.8" />
    <!-- Nose & Mouth -->
    <polygon points="0,0 -16,-12 16,-12" fill="#78350F" />
    <path d="M -16,12 Q 0,26 16,12" stroke="#78350F" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Math Plus Badge -->
    <circle cx="95" cy="95" r="44" fill="#10B981" stroke="#FFFFFF" stroke-width="8" />
    <text x="95" y="112" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle">+</text>
  </g>
</svg>
